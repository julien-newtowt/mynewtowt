name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Requis par gitleaks-action pour énumérer les commits d'une pull request
  # (le job `security` est en lecture seule ; aucun droit d'écriture accordé).
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Black --check
        run: black --check app tests
      - name: Mypy (informational — dette de typage, cf. seuil ci-dessous)
        # Non bloquant tant que la dette de typage des routers n'est pas
        # résorbée (cf. docs/audit/2026-06-10-repo-audit.md). Repasser
        # bloquant dès que `mypy app` est à zéro.
        #
        # Le libellé annonçait « baseline 142 » alors que le réel était 434 :
        # `continue-on-error` masquait toute dérive. On garde l'étape non
        # bloquante MAIS on la borne par un cliquet (étape suivante) : la dette
        # ne peut plus grossir sans que la CI le dise.
        run: mypy app
        continue-on-error: true
      - name: Cliquet anti-dérive du typage (bloquant)
        # Empêche la dette mypy d'augmenter silencieusement. Baisser
        # MYPY_MAX à chaque résorption — jamais l'augmenter sans décision
        # explicite tracée en PR.
        env:
          # 434 avant cette PR ; 371 après le typage correct de
          # `planning.ensure_utc` (@overload nullité-préservante).
          MYPY_MAX: "371"
        run: |
          COUNT=$(mypy app 2>/dev/null | sed -n 's/^Found \([0-9]\+\) errors.*/\1/p')
          COUNT=${COUNT:-0}
          echo "mypy : $COUNT erreurs (plafond $MYPY_MAX)"
          if [ "$COUNT" -gt "$MYPY_MAX" ]; then
            echo "::error::Dette de typage en hausse : $COUNT > $MYPY_MAX. Corriger, ou relever MYPY_MAX en le justifiant dans la PR."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Miroir ECR public : les pulls Docker Hub depuis les runners GitHub
        # expirent (rate limit / réseau) et faisaient échouer chaque run.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: towt
          POSTGRES_PASSWORD: change_me_local
          POSTGRES_DB: towt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: development
      SECRET_KEY: test_only_secret_key_with_more_than_32_characters_xxx
      DATABASE_URL: postgresql+asyncpg://towt:change_me_local@localhost:5432/towt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # WeasyPrint (génération PDF) s'appuie sur Pango/Cairo via des libs
      # système : sans elles, tous les tests de rendu PDF échouent en
      # OSError/cannot load library. Nécessaire depuis que `tests/integration`
      # est exécuté ici (il contient ~15 tests de rendu réel).
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info
      # tests/integration (110 fichiers) et tests/regression (4 fichiers, dont
      # la sentinelle des facteurs d'émission et le filet de parité V2↔V3)
      # n'étaient pas exécutés en CI : 29 échecs y vivaient invisibles, dont un
      # vrai bug applicatif (voyage_track, normalisation de fuseau) et une
      # régression introduite pendant sa correction. Voir
      # docs/DEVELOPMENT_JOURNAL_2026-07-27_2026-08-17.md (J1).
      - name: Run test suite with coverage
        run: pytest tests/unit tests/integration tests/regression --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Bandit static analysis
        run: bandit -r app -ll -ii
      - name: pip-audit vuln check
        # pip-audit installé hors requirements-dev : safety épinglait
        # pydantic<2.10 et cassait l'install de tous les jobs CI.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true   # informational
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        # GITHUB_TOKEN est devenu OBLIGATOIRE pour scanner une pull request
        # (breaking change de gitleaks-action v2). Sans lui, l'étape échouait
        # immédiatement — et `continue-on-error` la faisait passer pour verte :
        # aucune PR n'a jamais été scannée pour fuite de secret depuis ce
        # changement. Le token est fourni automatiquement par GitHub.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --no-banner --redact -v
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t mynewtowt:${{ github.sha }} .
