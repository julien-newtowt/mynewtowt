{# Options du <select> grille — filtrées par client + leg (partial HTMX).

   Les grilles qui ne couvrent pas la route du voyage visé sont **désignées et
   désactivées**, pas masquées : faire disparaître la grille négociée d'un
   client sans dire pourquoi se lit comme une panne. Le serveur refuse de toute
   façon la création (`POST /commercial/offers`), il ne se repose pas sur ce
   gabarit pour l'empêcher. #}
{% set covering = grids | selectattr('covers_leg') | list %}
{% set uncovering = grids | rejectattr('covers_leg') | list %}
<option value="">Sans grille</option>
{% for g in covering %}
<option value="{{ g.id }}">{{ g.reference }} · {% if g.client_id %}client{% else %}défaut{% endif %} · {{ g.lines|length }} route{{ 's' if g.lines|length != 1 else '' }}</option>
{% endfor %}
{% if uncovering %}
<optgroup label="Ne couvrent pas la route de ce voyage">
  {% for g in uncovering %}
  <option value="{{ g.id }}" disabled>{{ g.reference }} · client · {{ g.lines|length }} route{{ 's' if g.lines|length != 1 else '' }}</option>
  {% endfor %}
</optgroup>
{% endif %}
