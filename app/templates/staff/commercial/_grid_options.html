{# Options du <select> grille — filtrées par client (partial HTMX).

   Deuxième maillon de la cascade **client → grille → voyage** : c'est la grille
   choisie ici qui borne ensuite les voyages cotables. Une grille « défaut »
   (sans client) reste proposée : c'est le repli d'un client sans grille
   négociée, et l'étiquette le dit.

   Le `<select>` est `required` : la première option est une **invite**, pas un
   choix valide — `offer_create` exige une grille et un voyage, et laisser
   croire que « sans grille » passe ne produirait qu'un refus côté serveur. #}
<option value="">— Choisir une grille —</option>
{% for g in grids %}
<option value="{{ g.id }}">{{ g.reference }} · {% if g.client_id %}client{% else %}défaut{% endif %} · {{ g.lines|length }} route{{ 's' if g.lines|length != 1 else '' }}</option>
{% endfor %}
